<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>404 &mdash; Amir Razmjou</title>
<meta name="description" content="Packet dropped — no route to host.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">

<link rel="icon" href="/favicon.png" type="image/png">
<link rel="shortcut icon" href="/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --blueprint:#0a2540;--deep:#07192c;--graticule:rgba(120,170,220,.12);
  --ink:#e8eef5;--dim:#8fa6be;--prose:#cdd8e6;--signal:#ff8a3d;
  --field:rgba(120,170,220,.28);--cyan:#7fb2e6;--surface:rgba(120,170,220,.05);--border:rgba(120,170,220,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--blueprint);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.grid,.vign{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid{background:linear-gradient(var(--graticule) 1px,transparent 1px),linear-gradient(90deg,var(--graticule) 1px,transparent 1px);background-size:30px 30px;mask:radial-gradient(135% 100% at 50% 0%,#000 60%,transparent 100%);-webkit-mask:radial-gradient(135% 100% at 50% 0%,#000 60%,transparent 100%)}
.vign{background:radial-gradient(120% 90% at 50% -10%,rgba(255,138,61,.05),transparent 45%),radial-gradient(100% 80% at 50% 110%,var(--deep),transparent 60%)}
.wrap{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:0 28px}
a:focus-visible,button:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:4px}
.mlabel{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--signal)}
nav{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:22px 0;transition:.3s;border-bottom:1px solid transparent}
nav.scrolled{background:rgba(7,25,44,.72);backdrop-filter:blur(14px) saturate(1.2);border-bottom-color:var(--graticule);padding:14px 16px;margin:0 -16px}
.monogram{font-family:"Martian Mono",monospace;font-weight:700;font-size:15px;letter-spacing:-.5px;color:var(--ink);text-decoration:none}
.monogram b{color:var(--signal)}
nav .links{display:flex;gap:22px;font-family:"JetBrains Mono",monospace;font-size:13px}
nav .links a{color:var(--dim);text-decoration:none;transition:color .2s}
nav .links a:hover,nav .links a:focus-visible,nav .links a.active{color:var(--signal)}
section{padding:46px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;border-bottom:1px solid var(--graticule);padding-bottom:12px}
.section-head a.more{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim);text-decoration:none;white-space:nowrap}
.section-head a.more:hover{color:var(--signal)}
.cap-wrap{overflow-x:auto}
.cap{width:100%;border-collapse:collapse;font-size:15px}
.cap thead th{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 12px;border-bottom:1px solid var(--field);white-space:nowrap}
.cap td{padding:13px 12px;border-bottom:1px solid var(--graticule);vertical-align:baseline}
.cap tbody tr{transition:background .15s}
.cap tbody tr:hover{background:rgba(255,138,61,.06)}
.cap .no,.cap .time,.cap .len{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--dim);white-space:nowrap}
.cap .info{min-width:260px}
.cap .info a{color:var(--ink);text-decoration:none;font-weight:500}
.cap .info a:hover{color:var(--signal)}
.cap .info .desc{display:block;color:var(--dim);font-size:13.5px;margin-top:3px;font-weight:400;line-height:1.45}
.cap .mark{color:var(--signal);font-family:"JetBrains Mono",monospace;text-align:center}
.cap tr.hidden{display:none}
footer{position:relative;z-index:2;padding:36px 0;border-top:1px solid var(--graticule);margin-top:28px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--dim);text-decoration:none}
footer a:hover{color:var(--signal)}
#cmdk-overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(4,12,22,.6);backdrop-filter:blur(4px)}
#cmdk-overlay.open{display:block}
#cmdk{position:absolute;top:14vh;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:rgba(10,30,52,.97);border:1px solid var(--field);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;font-family:"JetBrains Mono",monospace}
#cmdk input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;font-family:"JetBrains Mono",monospace;padding:18px 20px;border-bottom:1px solid var(--graticule)}
#cmdk-list{list-style:none;margin:0;padding:6px;max-height:46vh;overflow-y:auto}
#cmdk-list li{padding:11px 14px;border-radius:9px;color:var(--prose);font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
#cmdk-list li .sub{color:var(--dim);font-size:11px;align-self:center;white-space:nowrap}
#cmdk-list li.sel,#cmdk-list li:hover{background:rgba(255,138,61,.14);color:var(--ink)}
#cmdk-empty{padding:18px 20px;color:var(--dim);font-size:14px}
#cmdk-hint{padding:9px 16px;border-top:1px solid var(--graticule);color:var(--dim);font-size:11px;display:flex;gap:14px}
@media(max-width:680px){.cap .len,.cap thead .len{display:none}.cap .info .desc{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#cmdk-overlay{backdrop-filter:none}}

body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:left;padding:24px}
.panel{position:relative;z-index:2;width:min(560px,94vw)}
.code-line{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--signal);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.code-line .dot{width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 12px var(--signal)}
.big404{font-family:"Martian Mono",monospace;font-weight:700;font-size:clamp(70px,18vw,150px);line-height:1;letter-spacing:-4px;color:var(--ink)}
.msg{font-size:19px;color:var(--prose);margin:14px 0 8px}
.detail{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--dim);margin-bottom:30px}
.home-link{display:inline-flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-size:13px;text-decoration:none;color:var(--ink);border:1px solid rgba(255,138,61,.4);background:rgba(255,138,61,.12);border-radius:7px;padding:10px 16px;transition:.2s}
.home-link:hover,.home-link:focus-visible{border-color:var(--signal);color:var(--signal);transform:translateY(-2px)}
.home-link .br{color:var(--dim)}
</style>
<style id="bg-anim">.grid{animation:gridpan 26s linear infinite}@keyframes gridpan{to{background-position:30px 30px}}@media(prefers-reduced-motion:reduce){.grid{animation:none}}</style>
<style id="mobile-fix">
@media(max-width:600px){
  .wrap{padding:0 18px}
  nav .links{gap:14px;flex-wrap:wrap;justify-content:flex-end}
  nav .links a{font-size:12px}
  .section-head{flex-wrap:wrap;gap:6px}
  .drow{display:block;padding:14px 16px}
  .drow .off{display:none}
  .drow .f{display:block;border:0;background:none;padding:0 0 6px}
  .drow .v{display:block;padding:0;min-height:0}
  .v .big{font-size:clamp(22px,7vw,30px);letter-spacing:-.5px}
  .v .role{font-size:clamp(16px,5vw,20px)}
  .v .pay{font-size:16px}
  .bitruler{padding-left:16px}
  .cap .info{min-width:0}
  .cap td,.cap thead th{padding:11px 8px}
  .cap .time{font-size:11.5px}
  .post-title{font-size:clamp(24px,7vw,34px);letter-spacing:-1px;overflow-wrap:break-word}
  .lead{font-size:17px}
  .prose{overflow-wrap:break-word}
}
@media(max-width:380px){
  nav .links{gap:10px}
}
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<div class="vign" aria-hidden="true"></div>
<main class="panel">
  <div class="code-line"><span class="dot"></span>icmp &middot; type 3 &middot; code 1</div>
  <div class="big404">404</div>
  <p class="msg">Packet dropped &mdash; no route to host.</p>
  <p class="detail">the resource you requested did not match any route in the table.</p>
  <a class="home-link" href="/"><span class="br">$</span> route to home</a>
</main>

</body>
</html>
